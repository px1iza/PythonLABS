
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "findex"
version = "0.7.0"
description = "A small ranked full-text search engine"
readme = "README_LAB_04.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.28.1",
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic-settings>=2.16.3",
    "jinja2>=3.1.6",
]

[project.scripts]
findex = "findex.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "pyright>=1.1.0",
    "ruff>=0.5.0",
    "build>=1.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/findex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: tests that take more than one second",
]

[tool.pyright]
include = ["src/findex", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
